version: "3.8"

services:
  # 1. Tu API de Python
  api:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  # 2. La Base de Datos PostgreSQL
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

  # 3. Prometheus (Lector de Métricas)
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # 4. Grafana (Tablero Visual)
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"